[workspace]
resolver = "3"
members = [
    "crates/tagma-raft",
    "crates/tagma-kv",
    "crates/tagma-wal",
    "crates/tagma-lincheck",
    "crates/tagma-sim",
    "crates/tagma-node",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
authors = ["Eduardo Marinho <eduardomarinho@pm.me>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/enfmarinho/tagma"
rust-version = "1.95"

[workspace.dependencies]
tagma-raft = { path = "crates/tagma-raft" }
tagma-kv = { path = "crates/tagma-kv" }
tagma-wal = { path = "crates/tagma-wal" }
tagma-lincheck = { path = "crates/tagma-lincheck" }

serde = { version = "1", features = ["derive"] }
postcard = { version = "1", default-features = false, features = ["alloc"]}

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
